name: Windows build, tests and portable release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build DaniOrganizer.sln -c Release
      - name: Test file operations
        run: dotnet run --project Tests/DaniOrganizer.Tests.csproj -c Release --no-build
      - name: Publish portable application
        run: dotnet publish Desktop/DaniOrganizer.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable
      - name: Verify desktop workflow
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/portable/DaniOrganizer.exe -ArgumentList '--ui-smoke' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop workflow failed: $($process.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md,CHANGELOG.md -Destination artifacts/portable
          Copy-Item docs -Destination artifacts/portable -Recurse
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/DaniOrganizer-Windows-x64.zip
          $hash = (Get-FileHash artifacts/DaniOrganizer-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DaniOrganizer-Windows-x64.zip" | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DaniOrganizer-Windows-x64
          path: |
            artifacts/DaniOrganizer-Windows-x64.zip
            artifacts/SHA256.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DaniOrganizer-Windows-x64
          path: artifacts
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content Desktop/DaniOrganizer.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version do not match' }
          gh release create $env:GITHUB_REF_NAME artifacts/DaniOrganizer-Windows-x64.zip artifacts/SHA256.txt --verify-tag --title "DaniOrganizer $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
